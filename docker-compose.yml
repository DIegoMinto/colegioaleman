services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./app:/var/www
      - node_modules:/var/www/node_modules
      - vendor:/var/www/vendor
      - storage_framework:/var/www/storage/framework
    networks:
      - app_network
    depends_on:
      - db

  nginx:
    image: nginx:stable-alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www
      - vendor:/var/www/vendor
      - storage_framework:/var/www/storage/framework
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app_network
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: laravel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app_network

  vite:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_vite
    restart: unless-stopped
    working_dir: /var/www
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./app:/var/www
      - node_modules:/var/www/node_modules
    ports:
      - "5173:5173"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  node_modules:
    driver: local
  vendor:
    driver: local
  storage_framework:
    driver: local
